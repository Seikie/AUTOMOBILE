<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, black, #ff6a00);
    color: white;
}

h1 {
    text-align: center;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 20px;
}

/* LEFT SIDE (ITEMS) */
.items {
    width: 350px;
}

.item {
    background: #111;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 0 10px orange;
}

/* RIGHT SIDE (PAYMENT FORM) */
.payment {
    width: 350px;
    background: #111;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 15px orange;
}

.payment input {
  width: 94%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  border-radius: 5px;
}

.row {
    display: flex;
    gap: 10px;
}

.total {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #ff6a00;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

button:hover {
    background: orange;
    box-shadow: 0 0 10px orange;
}
</style>
</head>

<body>

<h1>CHECKOUT</h1>

<div class="container">

    <!-- ITEMS -->
    <div class="items">
        <h2>Your Order</h2>
        <div id="items"></div>
        <div class="total" id="total"></div>
    </div>

    <!-- PAYMENT FORM -->
    <div class="payment">
        <h2>Card Details</h2>

        <input type="text" placeholder="Cardholder Name" id="name">
        <input type="text" placeholder="Card Number" id="card">

        <div class="row">
            <input type="text" placeholder="MM/YY" id="expiry">
            <input type="text" placeholder="CVV" id="cvv">
        </div>

        <button onclick="payNow()">Pay Now</button>
    </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let itemsDiv = document.getElementById("items");
let total = 0;


if (cart.length === 0) {
    document.getElementById("total").innerText = "No items selected";
} else {

    // DISPLAY ITEMS
    cart.forEach(item => {
        let div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `${item.name} - ₱${item.price.toLocaleString()}`;
        itemsDiv.appendChild(div);

        total += item.price;
    });

    // SHOW TOTAL
    document.getElementById("total").innerText =
        "Total: ₱" + total.toLocaleString();
}

//  PAYMENT BUTTON
function payNow() {
    let name = document.getElementById("name").value;
    let card = document.getElementById("card").value;
    let expiry = document.getElementById("expiry").value;
    let cvv = document.getElementById("cvv").value;

    if (!name || !card || !expiry || !cvv) {
        alert("Please fill all card details!");
        return;
    }

    alert("Payment Successful!");

    localStorage.removeItem("cart"); // clear after payment
    window.location.href = "home.html";
}

//  AUTO CLEAR 
window.addEventListener("beforeunload", function () {
    localStorage.removeItem("cart");
});
</script>

</body>
</html>
